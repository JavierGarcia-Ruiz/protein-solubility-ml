name: protein-solubility-ml
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Pure classical-ML environment: no PyTorch required.
      - numpy>=1.26
      - pandas>=2.1
      - scipy>=1.11
      - scikit-learn>=1.4
      - xgboost>=2.0
      - lightgbm>=4.3
      - optuna>=3.6
      - shap>=0.45
      - biopython>=1.83
      - pyarrow>=15
      - pyyaml>=6
      - matplotlib>=3.8
      - seaborn>=0.13
      - umap-learn>=0.5
      - pytest>=8
      - ruff>=0.4
      - nbformat
      - nbconvert
      - nbclient
      - ipykernel
      - -e .
