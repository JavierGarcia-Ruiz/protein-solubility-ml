[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solubility"
version = "0.1.0"
description = "Interpretable classical-ML prediction of protein solubility from sequence (PSI-Biology/DeepSol + eSOL) with SHAP explanations."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Javier Garcia-Ruiz" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "shap>=0.45",
    "biopython>=1.83",
    "pyarrow>=15",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "nbformat", "nbconvert", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N803", "N806", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
